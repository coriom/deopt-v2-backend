# V2G-L0 local Grafana dashboard provider. Mounts the dashboards
# directory and reads any JSON file inside.
apiVersion: 1

providers:
  - name: 'deopt-v2-fees'
    orgId: 1
    folder: 'DeOpt'
    folderUid: 'deopt'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
