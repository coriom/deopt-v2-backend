# V2G-L0 local Grafana datasource provisioning. Points Grafana at the
# in-network Prometheus container.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      manageAlerts: false
