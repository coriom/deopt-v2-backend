[package]
name = "deopt-v2-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
default = []
# Opt-in feature for the real `aws-sdk-kms`-backed AWS KMS transport.
# Default builds DO NOT pull the AWS SDK — keeping the dependency
# graph minimal for non-mainnet operators. Production mainnet
# deployments enable this feature explicitly via
# `cargo build --features aws-kms-transport`. See
# `docs/BACKEND_AWS_KMS_PRODUCTION_TRANSPORT_RESULT.md`.
aws-kms-transport = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types"]
# Opt-in in-process test signer for the Hybrid V2 pre-broadcast
# pipeline. Held behind a feature flag so non-test builds never
# instantiate a signer that holds raw key bytes in memory. See
# `src/hybrid_v2/execution/signer_ephemeral.rs`.
test-signer = []

[dependencies]
aws-config = { version = "1.5", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-sdk-kms = { version = "1.47", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1.7", optional = true, default-features = false, features = ["client"] }
aws-smithy-types = { version = "1.2", optional = true, default-features = false }
axum = { version = "0.7", features = ["ws"] }
alloy-primitives = "0.7"
alloy-sol-types = "0.7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
once_cell = "1"
rand = "0.8"
futures = { version = "0.3", default-features = false, features = ["std"] }
k256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quinn = { version = "=0.11.5", default-features = false, features = ["runtime-tokio", "rustls"] }
quinn-proto = { version = "=0.11.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "json"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
wtransport = { version = "=0.5.0", default-features = false }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
