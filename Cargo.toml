[package]
name = "deopt-v2-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
default = []
# Opt-in feature for the real `aws-sdk-kms`-backed AWS KMS transport.
# Default builds DO NOT pull the AWS SDK — keeping the dependency
# graph minimal for non-mainnet operators. Production mainnet
# deployments enable this feature explicitly via
# `cargo build --features aws-kms-transport`. See
# `docs/BACKEND_AWS_KMS_PRODUCTION_TRANSPORT_RESULT.md`.
aws-kms-transport = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types"]
# Opt-in in-process test signer for the Hybrid V2 pre-broadcast
# pipeline. Held behind a feature flag so non-test builds never
# instantiate a signer that holds raw key bytes in memory. See
# `src/hybrid_v2/execution/signer_ephemeral.rs`.
test-signer = []

[dependencies]
aws-config = { version = "1.5", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-sdk-kms = { version = "1.47", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1.7", optional = true, default-features = false, features = ["client"] }
aws-smithy-types = { version = "1.2", optional = true, default-features = false }
axum = { version = "0.7", features = ["ws"] }
alloy-primitives = "0.7"
alloy-sol-types = "0.7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
once_cell = "1"
rand = "0.8"
futures = { version = "0.3", default-features = false, features = ["std"] }
k256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quinn = { version = "=0.11.5", default-features = false, features = ["runtime-tokio", "rustls"] }
quinn-proto = { version = "=0.11.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "json"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
wtransport = { version = "=0.5.0", default-features = false }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

# Integration tests that exercise the test-only ephemeral signer must
# be built with the `test-signer` feature enabled so that
# `signer_ephemeral` is visible from the integration crate. Non-test
# builds never see the module.
[[test]]
name = "hybrid_v2_execution_simulator_and_signer_integration"
path = "tests/hybrid_v2_execution_simulator_and_signer_integration.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_orchestrator_pg_integration"
path = "tests/hybrid_v2_execution_orchestrator_pg_integration.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_full_pg_matrix"
path = "tests/hybrid_v2_execution_full_pg_matrix.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_properties"
path = "tests/hybrid_v2_execution_properties.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_performance_bounds"
path = "tests/hybrid_v2_execution_performance_bounds.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_live_orchestrator_pg_integration"
path = "tests/hybrid_v2_execution_live_orchestrator_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-EXTERNAL-SIGNER-INTEGRATION-AND-LIVE-ORCHESTRATOR-V1
# Package B (Parts M, N) — zero-broadcast source scan (default feature
# set) + shared external-signer harness (test-signer only). Subsequent
# Package B commits register the full matrix, properties, and
# performance test binaries.
[[test]]
name = "hybrid_v2_external_signer_no_broadcast_scan"
path = "tests/hybrid_v2_external_signer_no_broadcast_scan.rs"

[[test]]
name = "hybrid_v2_external_signer_harness"
path = "tests/hybrid_v2_external_signer_harness.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_external_signer_full_matrix_pg_integration"
path = "tests/hybrid_v2_external_signer_full_matrix_pg_integration.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_external_signer_properties"
path = "tests/hybrid_v2_external_signer_properties.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_external_signer_performance_bounds"
path = "tests/hybrid_v2_external_signer_performance_bounds.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-PRODUCTION-SIGNER-BOOTSTRAP-AND-STARTUP-WIRING-V1
# Parts G + I — end-to-end HTTP transport + bridge round trip against
# a local axum mock signer microservice.
[[test]]
name = "hybrid_v2_production_signer_http_e2e"
path = "tests/hybrid_v2_production_signer_http_e2e.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-PRODUCTION-SIGNER-BOOTSTRAP-AND-STARTUP-WIRING-V1
# Part H — restart-safety PG proofs for the production signer startup
# path. Every test drives `wire_hybrid_v2_execution_orchestrator` +
# a mock signer microservice + a mock JSON-RPC harness, rebuilds the
# orchestrator across a simulated main.rs restart, and asserts
# deterministic outcomes with ZERO broadcast RPCs.
[[test]]
name = "hybrid_v2_production_signer_app_restart_pg_integration"
path = "tests/hybrid_v2_production_signer_app_restart_pg_integration.rs"
required-features = ["test-signer"]
