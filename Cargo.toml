[package]
name = "deopt-v2-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
default = []
# Opt-in feature for the real `aws-sdk-kms`-backed AWS KMS transport.
# Default builds DO NOT pull the AWS SDK — keeping the dependency
# graph minimal for non-mainnet operators. Production mainnet
# deployments enable this feature explicitly via
# `cargo build --features aws-kms-transport`. See
# `docs/BACKEND_AWS_KMS_PRODUCTION_TRANSPORT_RESULT.md`.
aws-kms-transport = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types"]
# Opt-in in-process test signer for the Hybrid V2 pre-broadcast
# pipeline. Held behind a feature flag so non-test builds never
# instantiate a signer that holds raw key bytes in memory. See
# `src/hybrid_v2/execution/signer_ephemeral.rs`.
test-signer = []

[dependencies]
aws-config = { version = "1.5", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-sdk-kms = { version = "1.47", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1.7", optional = true, default-features = false, features = ["client"] }
aws-smithy-types = { version = "1.2", optional = true, default-features = false }
axum = { version = "0.7", features = ["ws"] }
alloy-primitives = "0.7"
alloy-sol-types = "0.7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
once_cell = "1"
rand = "0.8"
futures = { version = "0.3", default-features = false, features = ["std"] }
k256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quinn = { version = "=0.11.5", default-features = false, features = ["runtime-tokio", "rustls"] }
quinn-proto = { version = "=0.11.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "json"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
wtransport = { version = "=0.5.0", default-features = false }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

# Integration tests that exercise the test-only ephemeral signer must
# be built with the `test-signer` feature enabled so that
# `signer_ephemeral` is visible from the integration crate. Non-test
# builds never see the module.
[[test]]
name = "hybrid_v2_execution_simulator_and_signer_integration"
path = "tests/hybrid_v2_execution_simulator_and_signer_integration.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_orchestrator_pg_integration"
path = "tests/hybrid_v2_execution_orchestrator_pg_integration.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_full_pg_matrix"
path = "tests/hybrid_v2_execution_full_pg_matrix.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_properties"
path = "tests/hybrid_v2_execution_properties.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_performance_bounds"
path = "tests/hybrid_v2_execution_performance_bounds.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_execution_live_orchestrator_pg_integration"
path = "tests/hybrid_v2_execution_live_orchestrator_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-EXTERNAL-SIGNER-INTEGRATION-AND-LIVE-ORCHESTRATOR-V1
# Package B (Parts M, N) — zero-broadcast source scan (default feature
# set) + shared external-signer harness (test-signer only). Subsequent
# Package B commits register the full matrix, properties, and
# performance test binaries.
[[test]]
name = "hybrid_v2_external_signer_no_broadcast_scan"
path = "tests/hybrid_v2_external_signer_no_broadcast_scan.rs"

[[test]]
name = "hybrid_v2_external_signer_harness"
path = "tests/hybrid_v2_external_signer_harness.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_external_signer_full_matrix_pg_integration"
path = "tests/hybrid_v2_external_signer_full_matrix_pg_integration.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_external_signer_properties"
path = "tests/hybrid_v2_external_signer_properties.rs"
required-features = ["test-signer"]

[[test]]
name = "hybrid_v2_external_signer_performance_bounds"
path = "tests/hybrid_v2_external_signer_performance_bounds.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-PRODUCTION-SIGNER-BOOTSTRAP-AND-STARTUP-WIRING-V1
# Parts G + I — end-to-end HTTP transport + bridge round trip against
# a local axum mock signer microservice.
[[test]]
name = "hybrid_v2_production_signer_http_e2e"
path = "tests/hybrid_v2_production_signer_http_e2e.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-PRODUCTION-SIGNER-BOOTSTRAP-AND-STARTUP-WIRING-V1
# Part H — restart-safety PG proofs for the production signer startup
# path. Every test drives `wire_hybrid_v2_execution_orchestrator` +
# a mock signer microservice + a mock JSON-RPC harness, rebuilds the
# orchestrator across a simulated main.rs restart, and asserts
# deterministic outcomes with ZERO broadcast RPCs.
[[test]]
name = "hybrid_v2_production_signer_app_restart_pg_integration"
path = "tests/hybrid_v2_production_signer_app_restart_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-PRODUCTION-SIGNER-BOOTSTRAP-AND-STARTUP-WIRING-V1
# Part J — full application startup matrix covering config, signer
# construction, runtime behaviour, admin surface, and operational
# recovery paths. Every test goes through
# `wire_hybrid_v2_execution_orchestrator` (never AppState direct
# injection).
[[test]]
name = "hybrid_v2_production_signer_full_startup_matrix_pg_integration"
path = "tests/hybrid_v2_production_signer_full_startup_matrix_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-AND-CONFIRMATION-V1 (Package A, Parts C-I)
# PostgreSQL coverage for the broadcast state table (migration 0051),
# phase machine, immutability trigger, and outbox flows against a
# deterministic in-process mock RPC. NO REAL EXTERNAL CHAIN TRANSACTION
# IS EVER BROADCAST.
[[test]]
name = "hybrid_v2_broadcast_foundation_pg_integration"
path = "tests/hybrid_v2_broadcast_foundation_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-AND-CONFIRMATION-V1 (Package B, Parts J-P)
# Lifecycle PG coverage: idempotent resume + same-byte resend, nonce
# conflict investigation, receipt polling, canonicality verification,
# confirmation depth math, indexer correlation, and the final
# confirmation rule. Reuses the shared MockBroadcastRpc harness.
[[test]]
name = "hybrid_v2_broadcast_lifecycle_pg_integration"
path = "tests/hybrid_v2_broadcast_lifecycle_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-AND-CONFIRMATION-V1 (Package C, Part Q)
# Transaction reorg recovery PG coverage: exercises the six deterministic
# outcomes of BroadcastReorgRecovery against a real PostgreSQL store +
# the shared MockBroadcastRpc harness. Never re-signs, never fee-bumps,
# never reserves a fresh nonce.
[[test]]
name = "hybrid_v2_broadcast_reorg_recovery_pg_integration"
path = "tests/hybrid_v2_broadcast_reorg_recovery_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-AND-CONFIRMATION-V1 (Package C, Part R)
# Restart-safety PG coverage: for every broadcast phase, simulate a
# crash by dropping the outbox/worker and rebuilding fresh instances
# from the same PostgreSQL row. Asserts the tx_hash is preserved
# byte-identically, no fresh nonce is reserved, and no re-signer call
# is issued.
[[test]]
name = "hybrid_v2_broadcast_restart_pg_integration"
path = "tests/hybrid_v2_broadcast_restart_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-AND-CONFIRMATION-V1 (Package C, Part S)
# Admin PG coverage: /admin/hybrid_v2/deployments/*/executions/*/broadcast
# and companion routes. Asserts admin token gating, structured 503 when
# broadcast is disabled, bounded resend policy, sanitized status
# response, and rejection of unknown fields at the JSON body boundary.
[[test]]
name = "hybrid_v2_broadcast_admin_pg_integration"
path = "tests/hybrid_v2_broadcast_admin_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-LIVE-WIRING-CLOSURE-V1 — Part K.
# Full-application restart matrix. Drops the entire AppState between
# every phase transition and rebuilds via the production
# `wire_hybrid_v2_broadcast` path + `spawn_supervised` worker. Asserts
# tx_hash / nonce / signature identity are preserved and no re-signer
# ever runs. NO REAL PUBLIC-CHAIN TRANSACTION IS EVER SENT.
[[test]]
name = "hybrid_v2_broadcast_live_wiring_app_restart_pg_integration"
path = "tests/hybrid_v2_broadcast_live_wiring_app_restart_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-LIVE-WIRING-CLOSURE-V1 — Part L.
# Full live-wiring PG matrix. Exercises startup + config, admin surface,
# outbox contract, automatic worker progression, nonce conflict,
# shutdown / restart, deployment isolation, RPC + PG outage, recheck
# semantics, and RPC discipline — every test drives the production
# `wire_hybrid_v2_broadcast` path against `MockBroadcastRpc`.
# NO REAL PUBLIC-CHAIN TRANSACTION IS EVER SENT.
[[test]]
name = "hybrid_v2_broadcast_live_wiring_matrix_pg_integration"
path = "tests/hybrid_v2_broadcast_live_wiring_matrix_pg_integration.rs"
required-features = ["test-signer"]

# BACKEND-HYBRID-V2-BROADCAST-LIVE-WIRING-CLOSURE-V1 — Part M.
# Bounded property tests over the live broadcast wiring path. Every
# property is exercised across a small deterministic sample set
# driven by fixed seed material — no new Cargo deps are introduced
# (no `proptest` crate; follows the same deterministic-loop
# convention as `tests/hybrid_v2_broadcast_properties.rs`). Every
# mock-driven property asserts `mock.write_method_calls()` contains
# only `eth_sendRawTransaction` on exit. NO REAL PUBLIC-CHAIN
# TRANSACTION IS EVER SENT.
[[test]]
name = "hybrid_v2_broadcast_live_wiring_properties"
path = "tests/hybrid_v2_broadcast_live_wiring_properties.rs"
required-features = ["test-signer"]
